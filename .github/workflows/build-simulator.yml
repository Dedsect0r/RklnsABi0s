name: Build for Simulator (Appetize)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Restore GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > RocklenseAB/GoogleService-Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Add Google Sign-In URL scheme
        run: |
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" RocklenseAB/GoogleService-Info.plist)
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" RocklenseAB/Resources/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" RocklenseAB/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" RocklenseAB/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" RocklenseAB/Resources/Info.plist

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project RocklenseAB.xcodeproj \
            -scheme RocklenseAB \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            clean build

      - name: Zip the .app for Appetize
        run: |
          cd "build/Build/Products/Debug-iphonesimulator"
          zip -r RocklenseAB-simulator.zip RocklenseAB.app

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RocklenseAB-simulator
          path: build/Build/Products/Debug-iphonesimulator/RocklenseAB-simulator.zip
          retention-days: 14
